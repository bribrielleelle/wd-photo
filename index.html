<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery - Brielle Davis</title>
    <meta name="description" content="A cotton candy themed 9-photo gallery celebrating Brielle Davis with password entry protection and a pastel 3x3 photo grid" />
    <meta property="og:title" content="Photo Gallery - Brielle Davis" />
    <meta property="og:description" content="A cotton candy themed 9-photo gallery celebrating Brielle Davis with password entry protection and a pastel 3x3 photo grid" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, #e9d5ff 0%, #f5d0fe 35%, #fbcfe8 70%, #fce7f3 100%);
        background-attachment: fixed;
        min-height: 100vh;
        color: #374151;
      }
      .gallery-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2.5rem 1rem;
      }
      .profile-banner {
        text-align: center;
        margin-bottom: 2rem;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #fbcfe8;
        border-radius: 1.25rem;
        padding: 1.5rem 1rem;
        box-shadow: 0 4px 20px -2px rgba(244, 114, 182, 0.12);
      }
      .theme-pill {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ec4899;
        background: #fdf2f8;
        padding: 0.25rem 0.875rem;
        border-radius: 9999px;
        border: 1px solid #fbcfe8;
        margin-bottom: 0.5rem;
      }
      .user-name {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #1f2937;
        margin-bottom: 0.5rem;
      }
      .birthday-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #0284c7;
        background: #e0f2fe;
        padding: 0.375rem 1rem;
        border-radius: 9999px;
        border: 1px solid #bae6fd;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 1.25rem;
      }
      .photo-card {
        background-color: #ffffff;
        border-radius: 0.875rem;
        overflow: hidden;
        border: 1px solid #fce7f3;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 12px -2px rgba(244, 114, 182, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .photo-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px -4px rgba(244, 114, 182, 0.18);
        border-color: #f472b6;
      }
      .image-wrapper {
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background: linear-gradient(135deg, #fdf2f8, #e0f2fe);
      }
      .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .photo-info {
        padding: 0.75rem 0.875rem;
        text-align: center;
        background: #ffffff;
      }
      .photo-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
      }
      @media (max-width: 640px) {
        .gallery-container {
          padding: 1.25rem 0.75rem;
        }
        .user-name {
          font-size: 1.5rem;
        }
        .photo-grid {
          gap: 0.625rem;
        }
        .photo-info {
          padding: 0.5rem 0.25rem;
        }
        .photo-title {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="gallery-container">
        <header class="profile-banner">
          <span class="theme-pill">Sweet Edition</span>
          <h1 class="user-name">BRIELLE DAVIS</h1>
          <div>
            <span class="birthday-badge">🎂 Birthday: 10-18-2011</span>
          </div>
        </header>

        <section class="photo-grid" id="photo-grid">
          <!-- Row 1 -->
          <article class="photo-card" id="photo-card-1" style="cursor: pointer;" onclick="window.location.hash='pink-conchas';">
            <div class="image-wrapper">
               <img
                src="https://cdn.apartmenttherapy.info/image/upload/f_auto,q_auto:eco,w_730/tk%2Fphoto%2F2025%2F05-2025%2F2025-05-conchas%2Fconchas-643"
                alt="Yummy"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/yummy-conchas.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Yummy ↗</h2>
            </div>
          </article>

          <article class="photo-card" id="photo-card-2">
            <div class="image-wrapper">
              <img
                src="https://media.istockphoto.com/id/534132623/photo/heart-marshmallows-background.jpg?s=612x612&w=0&k=20&c=1XKgVgQpsctHbd5YB8pjudmLCifFJd-1SecBS0pCcD0="
                alt="Pink Marshmallows"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/pink-marshmallows.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Pink Marshmallows</h2>
            </div>
          </article>

          <article class="photo-card" id="photo-card-3" style="cursor: pointer;" onclick="window.location.hash='pink-macarons';">
            <div class="image-wrapper">
              <img
                src="https://blog.wilton.com/wp-content/uploads/sites/2/2021/02/Troubleshooting-French-Macaron-Recipe.jpg"
                alt="Pink Macarons"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/pink-macarons.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Pink Macarons ↗</h2>
            </div>
          </article>

          <!-- Row 2 -->
          <article class="photo-card" id="photo-card-4" style="cursor: pointer;" onclick="window.location.hash='pusheen';">
            <div class="image-wrapper">
              <img
                src="https://pusheen.com/cdn/shop/files/PusheenSweetsCherryMacaronPlush2-pcEnvironment_009_web.jpg?v=1752088267"
                alt="Pusheen"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/pusheen-macaron.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Pusheen ↗</h2>
            </div>
          </article>

          <article class="photo-card" id="photo-card-5">
            <div class="image-wrapper">
              <img
                src="https://pusheen.com/cdn/shop/files/Strawberry_Sponge_Cake_Squisheen_Plush_008_web.jpg?v=1737737676"
                alt="Is"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/pusheen-sponge-cake.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Is</h2>
            </div>
          </article>

          <article class="photo-card" id="photo-card-6" style="cursor: pointer;" onclick="window.location.hash='comics';">
            <div class="image-wrapper">
               <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBFkryQYWjBpQVW4kTmuDmNtPTLHVpfEt8Q6EQ6Os_jpbBKsM4w6X-PsrS&s=10"
                alt="Cool!"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/cool.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Cool! ↗</h2>
            </div>
          </article>

          <!-- Row 3 -->
          <article class="photo-card" id="photo-card-7" style="cursor: pointer;" onclick="window.location.hash='burberry-her';">
            <div class="image-wrapper">
              <img
                src="https://fimgs.net/mdimg/secundar/fit.143897.jpg"
                alt="Burberry Her"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/burberry-her.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Burberry Her ↗</h2>
            </div>
          </article>

          <article class="photo-card" id="photo-card-8" style="cursor: pointer;" onclick="window.location.hash='marshmallow-blush';">
            <div class="image-wrapper">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8DN0xRINXm8HviF3WICbd9jSYn7qYYs29yLNRmwO5ln-DXBADNQYRY9Jy&s=10"
                alt="Marshmallow Blush"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/marshmallow-blush.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Marshmallow Blush ↗</h2>
            </div>
          </article>

          <article class="photo-card" id="photo-card-9" style="cursor: pointer;" onclick="window.location.hash='sweetest-song';">
            <div class="image-wrapper">
              <img
                src="https://imgix.bustle.com/uploads/image/2025/3/21/1614085c/sweetest-song-full-collection.tif?w=414&h=394&fit=crop&crop=faces&dpr=2"
                alt="Sweetest Song"
                class="photo-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null;this.src='/sweetest-song.jpg';"
              />
            </div>
            <div class="photo-info">
              <h2 class="photo-title">Sweetest Song ↗</h2>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
